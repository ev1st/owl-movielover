<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Owl MovieLover</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="page">
    <section class="login-card">
      <a class="back-link" href="index.html">← На главную</a>
      <div class="owl-mark" aria-hidden="true">🦉</div>
      <p class="eyebrow">OWL MOVIELOVER</p>
      <h1>С возвращением, вась!</h1>
      <p class="subtitle">Войди в аккаунт, вась.</p>

      <form class="login-form" action="#" method="get">
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" placeholder="Введи пароль" autocomplete="current-password" required>

        <button type="submit">Войти</button>
      </form>

      <p class="switch-text">Еще нет аккаунта? <a href="registration.html">Зарегистрироваться</a></p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
